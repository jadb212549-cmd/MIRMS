name: Windows Portable Executable Build Pipeline

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Publish as GitHub Release draft?'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-windows-portable-exe:
    name: Build & Package Windows Portable EXE (x64)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js (v22 LTS)
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      - name: Environment Diagnostics
        run: |
          node --version
          npm --version

      - name: Install Rust toolchain (x86_64-pc-windows-msvc)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Rust Toolchain Diagnostics
        run: |
          rustc --version
          cargo --version

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Compile Frontend Assets (Vite + React)
        run: npm run build

      - name: Build Standalone Windows Desktop Executable
        run: |
          cargo build --manifest-path src-tauri/Cargo.toml --release --target x86_64-pc-windows-msvc
        env:
          RUST_BACKTRACE: 1

      - name: Assemble Portable Distribution & Verify ZIP
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host "=== Step 1: Searching for compiled Windows executable (.exe) ==="
          $targetDir = "src-tauri/target"
          if (-not (Test-Path $targetDir)) {
              $targetDir = "target"
          }

          Write-Host "Scanning target directory: $targetDir"
          if (Test-Path $targetDir) {
              Get-ChildItem -Path $targetDir -Recurse -Filter "*.exe" | ForEach-Object {
                  Write-Host " Found exe: $($_.FullName)"
              }
          } else {
              Write-Host "Target directory $targetDir does not exist!"
          }

          # Locate release executable, excluding deps/build/incremental/examples folders
          $exeFiles = Get-ChildItem -Path . -Recurse -Filter "*.exe" | Where-Object {
              $_.FullName -notmatch '\\deps\\' -and
              $_.FullName -notmatch '\\build\\' -and
              $_.FullName -notmatch '\\incremental\\' -and
              $_.FullName -notmatch '\\examples\\'
          }

          $targetExe = $null
          foreach ($file in $exeFiles) {
              if ($file.Name -eq "material-reference-tracker.exe" -or $file.Name -eq "ReferenceTracker.exe") {
                  $targetExe = $file.FullName
                  break
              }
          }

          if (-not $targetExe -and $exeFiles.Count -gt 0) {
              $targetExe = $exeFiles[0].FullName
          }

          if (-not $targetExe -or -not (Test-Path $targetExe)) {
              Write-Error "CRITICAL ERROR: No compiled application executable (.exe) found in target release directories!"
              exit 1
          }

          Write-Host "Successfully detected binary executable at: $targetExe"

          Write-Host "=== Step 2: Assembling Portable Distribution Directory ==="
          $distDir = "ReferenceTracker-Windows-Portable"
          if (Test-Path $distDir) {
              Remove-Item $distDir -Recurse -Force
          }

          New-Item -ItemType Directory -Path "$distDir/ReferenceTracker_Data/database" -Force | Out-Null
          New-Item -ItemType Directory -Path "$distDir/ReferenceTracker_Data/references/PHOTOS" -Force | Out-Null
          New-Item -ItemType Directory -Path "$distDir/ReferenceTracker_Data/references/ATTACHMENTS" -Force | Out-Null
          New-Item -ItemType Directory -Path "$distDir/ReferenceTracker_Data/references/FORMS" -Force | Out-Null
          New-Item -ItemType Directory -Path "$distDir/ReferenceTracker_Data/templates" -Force | Out-Null
          New-Item -ItemType Directory -Path "$distDir/ReferenceTracker_Data/backups" -Force | Out-Null

          New-Item -ItemType File -Path "$distDir/ReferenceTracker_Data/database/.gitkeep" -Force | Out-Null
          New-Item -ItemType File -Path "$distDir/ReferenceTracker_Data/references/PHOTOS/.gitkeep" -Force | Out-Null
          New-Item -ItemType File -Path "$distDir/ReferenceTracker_Data/references/ATTACHMENTS/.gitkeep" -Force | Out-Null
          New-Item -ItemType File -Path "$distDir/ReferenceTracker_Data/references/FORMS/.gitkeep" -Force | Out-Null
          New-Item -ItemType File -Path "$distDir/ReferenceTracker_Data/templates/.gitkeep" -Force | Out-Null
          New-Item -ItemType File -Path "$distDir/ReferenceTracker_Data/backups/.gitkeep" -Force | Out-Null

          Copy-Item -Path $targetExe -Destination "$distDir/ReferenceTracker.exe" -Force

          # Create START_PORTABLE.bat
          @'
          @echo off
          title Material Reference & Sample Tracker
          cd /d "%~dp0"
          if not exist "ReferenceTracker.exe" (
              echo [ERROR] ReferenceTracker.exe was not found in: "%~dp0"
              echo Please ensure all files from the ZIP were extracted into the same folder.
              echo.
              pause
              exit /b 1
          )
          start "" "%~dp0ReferenceTracker.exe"
          exit
          '@ | Set-Content -Path "$distDir/START_PORTABLE.bat" -Encoding ASCII

          # Create DEBUG_RUN.bat
          @'
          @echo off
          title Material Reference Tracker - Debug Launcher
          cd /d "%~dp0"
          echo ======================================================================
          echo   Material Reference & Sample Tracker - Diagnostic Launcher
          echo ======================================================================
          echo.
          echo Working Directory: %CD%
          echo Checking executable...
          if not exist "ReferenceTracker.exe" (
              echo [ERROR] ReferenceTracker.exe not found in this folder!
              echo.
              pause
              exit /b 1
          )
          echo Launching ReferenceTracker.exe with diagnostic logging...
          echo.
          set RUST_BACKTRACE=1
          set RUST_LOG=debug
          "%~dp0ReferenceTracker.exe"
          echo.
          echo Application process ended with exit code: %ERRORLEVEL%
          if exist "ReferenceTracker_crash.log" (
              echo.
              echo ----------------------------------------------------------------------
              echo [CRASH DETECTED] Contents of ReferenceTracker_crash.log:
              type "ReferenceTracker_crash.log"
              echo ----------------------------------------------------------------------
          )
          if exist "ReferenceTracker_startup_error.log" (
              echo.
              echo ----------------------------------------------------------------------
              echo [STARTUP ERROR] Contents of ReferenceTracker_startup_error.log:
              type "ReferenceTracker_startup_error.log"
              echo ----------------------------------------------------------------------
          )
          echo.
          pause
          '@ | Set-Content -Path "$distDir/DEBUG_RUN.bat" -Encoding ASCII

          # Create UNBLOCK_FILES.bat
          @'
          @echo off
          title Unblock Downloaded Reference Tracker Files
          cd /d "%~dp0"
          echo Unblocking Windows Mark-of-the-Web security flags on downloaded files...
          powershell -NoProfile -ExecutionPolicy Bypass -Command "Get-ChildItem -Path . -Recurse | Unblock-File; Write-Host 'All files have been successfully unblocked!' -ForegroundColor Green"
          echo.
          echo Done. You may now run ReferenceTracker.exe or START_PORTABLE.bat.
          echo.
          pause
          '@ | Set-Content -Path "$distDir/UNBLOCK_FILES.bat" -Encoding ASCII

          # Create README_PORTABLE.txt
          @'
          ================================================================================
          MATERIAL REFERENCE & SAMPLE TRACKING SYSTEM (PORTABLE WINDOWS EDITION)
          ================================================================================

          1. FIRST-TIME QUICK START:
             - Step 1: ALWAYS EXTRACT ALL FILES from the ZIP to a real folder on your PC
                       (e.g., Desktop, Documents, C:\Tools\ReferenceTracker, or USB Drive).
                       Do NOT run ReferenceTracker.exe directly from inside the ZIP file!
             - Step 2: Double-click "ReferenceTracker.exe" (or "START_PORTABLE.bat").
             - Step 3: If Windows Defender SmartScreen appears, click "More info" and then
                       "Run anyway" (this occurs for newly packaged portable executables).

          2. PORTABLE STORAGE ARCHITECTURE:
             - All master items, quality samples, high-res photos, specification TDS files,
               audit logs, and custom settings are stored locally in the "ReferenceTracker_Data"
               folder right beside the executable.
             - SQLite Database: ReferenceTracker_Data/database/material_reference.db
             - Reference Photos: ReferenceTracker_Data/references/PHOTOS/
             - Specification Documents: ReferenceTracker_Data/references/ATTACHMENTS/
             - Generated Word DOCX Forms: ReferenceTracker_Data/references/FORMS/
             - Custom Word Templates: ReferenceTracker_Data/templates/
             - Full System Backups: ReferenceTracker_Data/backups/

          3. SYSTEM PREREQUISITES:
             - Windows 10 (64-bit) or Windows 11.
             - Microsoft Edge WebView2 Runtime (included natively in modern Windows 10/11).
               If missing on legacy Windows systems, download WebView2 Evergreen Bootstrapper:
               https://developer.microsoft.com/en-us/microsoft-edge/webview2/

          4. TROUBLESHOOTING:
             - If the app does not launch or closes immediately:
               1. Run "DEBUG_RUN.bat" to see exact diagnostic messages in a console window.
               2. Run "UNBLOCK_FILES.bat" if Windows blocked the downloaded ZIP files.
               3. Check "ReferenceTracker_crash.log" or "ReferenceTracker_startup_error.log".
               4. Verify the folder is not in a read-only location or locked network drive.

          5. HOW TO BACK UP OR TRANSFER:
             - Simply copy the entire folder containing "ReferenceTracker.exe" and
               "ReferenceTracker_Data" to any USB flash drive or backup location.
          ================================================================================
          '@ | Set-Content -Path "$distDir/README_PORTABLE.txt" -Encoding UTF8

          # Create ABOUT_DATABASE.txt
          @'
          This directory stores the offline SQLite database (material_reference.db).
          The database contains:
          - Master Item Catalog (Raw Materials RM and Packaging Supplies PS)
          - Sample Registrations & Revisions
          - Full Audit Trail Logs
          - System Configuration & Custom Field Schema
          '@ | Set-Content -Path "$distDir/ReferenceTracker_Data/database/ABOUT_DATABASE.txt" -Encoding UTF8

          Write-Host "Portable directory structure assembled successfully."

          Write-Host "=== Step 3: Creating Portable ZIP Archive ==="
          $zipName = "ReferenceTracker-Windows-Portable-x64.zip"
          if (Test-Path $zipName) {
              Remove-Item $zipName -Force
          }

          Compress-Archive -Path $distDir -DestinationPath $zipName -Force

          Write-Host "=== Step 4: Verifying Created ZIP Archive ==="
          if (-not (Test-Path $zipName)) {
              Write-Error "CRITICAL ERROR: Failed to create expected ZIP file '$zipName'!"
              exit 1
          }

          $zipFile = Get-Item $zipName
          if ($zipFile.Length -le 0) {
              Write-Error "CRITICAL ERROR: Created ZIP file '$zipName' is 0 bytes!"
              exit 1
          }

          Write-Host "SUCCESS: Verified '$zipName' exists (Size: $($zipFile.Length) bytes)."

      - name: Upload Windows Portable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ReferenceTracker-Windows-Portable-x64
          path: ReferenceTracker-Windows-Portable-x64.zip
          if-no-files-found: error
          retention-days: 90

      - name: Create GitHub Release Draft (On Tag Push or Manual Request)
        if: startsWith(github.ref, 'refs/tags/v') || (github.event.inputs && github.event.inputs.create_release == 'true')
        uses: softprops/action-gh-release@v2
        with:
          files: ReferenceTracker-Windows-Portable-x64.zip
          name: ReferenceTracker Portable Windows ${{ github.ref_name }}
          body: |
            ## Material Reference & Sample Tracking System - Portable Windows Release

            Standalone, offline-first portable executable for Windows x64.

            ### Package Contents:
            - `ReferenceTracker.exe`: Standalone desktop executable (no install required).
            - `ReferenceTracker_Data/`: Visible data directory located directly beside the `.exe` holding your SQLite database, reference photos, document attachments, generated Word forms, and templates.
            - `README_PORTABLE.txt`: Portability and backup instructions.
            - `START_PORTABLE.bat`: One-click startup script.

            ### Instructions:
            1. Download `ReferenceTracker-Windows-Portable-x64.zip`.
            2. Extract the zip to any folder, Desktop, or USB drive.
            3. Run `ReferenceTracker.exe`.
          draft: true
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
