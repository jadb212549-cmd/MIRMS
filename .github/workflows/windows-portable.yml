name: Windows Portable Executable Build Pipeline

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Publish as GitHub Release draft?'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-windows-portable-exe:
    name: Build & Package Windows Portable EXE (x64)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust toolchain (x86_64-pc-windows-msvc)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Compile Frontend Assets (Vite + React)
        run: npm run build

      - name: Build Standalone Windows Desktop Executable
        run: |
          cargo build --manifest-path src-tauri/Cargo.toml --release --target x86_64-pc-windows-msvc
        env:
          RUST_BACKTRACE: 1

      - name: Assemble Portable Distribution with Visible Data Folder Beside EXE
        shell: bash
        run: |
          # Create root portable distribution directory
          DIST_DIR="ReferenceTracker-Windows-Portable"
          mkdir -p "$DIST_DIR"

          # Create visible data folders directly beside the portable executable
          mkdir -p "$DIST_DIR/ReferenceTracker_Data/database"
          mkdir -p "$DIST_DIR/ReferenceTracker_Data/references/PHOTOS"
          mkdir -p "$DIST_DIR/ReferenceTracker_Data/references/ATTACHMENTS"
          mkdir -p "$DIST_DIR/ReferenceTracker_Data/references/FORMS"
          mkdir -p "$DIST_DIR/ReferenceTracker_Data/templates"
          mkdir -p "$DIST_DIR/ReferenceTracker_Data/backups"

          # Place directory markers and documentation
          touch "$DIST_DIR/ReferenceTracker_Data/database/.gitkeep"
          touch "$DIST_DIR/ReferenceTracker_Data/references/PHOTOS/.gitkeep"
          touch "$DIST_DIR/ReferenceTracker_Data/references/ATTACHMENTS/.gitkeep"
          touch "$DIST_DIR/ReferenceTracker_Data/references/FORMS/.gitkeep"
          touch "$DIST_DIR/ReferenceTracker_Data/templates/.gitkeep"
          touch "$DIST_DIR/ReferenceTracker_Data/backups/.gitkeep"

          # Copy compiled Windows EXE to the root of the portable package
          if [ -f "src-tauri/target/x86_64-pc-windows-msvc/release/material-reference-tracker.exe" ]; then
            cp "src-tauri/target/x86_64-pc-windows-msvc/release/material-reference-tracker.exe" "$DIST_DIR/ReferenceTracker.exe"
          elif [ -f "src-tauri/target/release/material-reference-tracker.exe" ]; then
            cp "src-tauri/target/release/material-reference-tracker.exe" "$DIST_DIR/ReferenceTracker.exe"
          else
            echo "Searching for executable..."
            find src-tauri/target -name "*.exe" -exec cp {} "$DIST_DIR/ReferenceTracker.exe" \;
          fi

          # Create descriptive README for portable data placement
          cat << 'EOF' > "$DIST_DIR/README_PORTABLE.txt"
================================================================================
MATERIAL REFERENCE & SAMPLE TRACKING SYSTEM (PORTABLE WINDOWS EDITION)
================================================================================

1. PORTABLE STORAGE ARCHITECTURE:
   - All your master catalog items, sample reference records, photo attachments,
     specification documents, and audit trails are stored right beside this
     executable inside the "ReferenceTracker_Data" folder.
   - SQLite Database file: ReferenceTracker_Data/database/material_reference.db
   - High-Res Specimen Photos: ReferenceTracker_Data/references/PHOTOS/
   - Specification & TDS Files: ReferenceTracker_Data/references/ATTACHMENTS/
   - Generated Word Documents: ReferenceTracker_Data/references/FORMS/
   - Custom Word Form Templates: ReferenceTracker_Data/templates/
   - Full Portable Backups: ReferenceTracker_Data/backups/

2. HOW TO RUN:
   - Double-click "ReferenceTracker.exe" (or "START_PORTABLE.bat") to launch.
   - No installation, admin privileges, or cloud setup required.
   - Works 100% offline.

3. HOW TO BACK UP OR TRANSFER TO A USB DRIVE:
   - Simply copy the entire folder containing "ReferenceTracker.exe" and
     "ReferenceTracker_Data" to any USB flash drive or external storage.
   - All data stays intact and portable across any Windows PC.

4. ZERO INVENTORY DESIGN MANDATE:
   - This system is engineered specifically for reference sample quality,
     revisions, specifications, and physical retention tracking. Stock counts
     and inventory quantities are excluded by design.
================================================================================
EOF

          # Create one-click Windows launcher helper
          cat << 'EOF' > "$DIST_DIR/START_PORTABLE.bat"
@echo off
title Material Reference & Sample Tracker
start "" "%~dp0ReferenceTracker.exe"
exit
EOF

          # Create Database info file inside the visible data folder
          cat << 'EOF' > "$DIST_DIR/ReferenceTracker_Data/database/ABOUT_DATABASE.txt"
This directory stores the offline SQLite database (material_reference.db).
The database contains:
- Master Item Catalog (Raw Materials RM and Packaging Supplies PS)
- Sample Registrations & Revisions
- Full Audit Trail Logs
- System Configuration & Custom Field Schema
EOF

          # Compress to zip for artifact upload and release
          7z a -tzip ReferenceTracker-Windows-Portable-x64.zip "$DIST_DIR"

      - name: Upload Windows Portable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ReferenceTracker-Windows-Portable-x64
          path: ReferenceTracker-Windows-Portable-x64.zip
          if-no-files-found: error
          retention-days: 90

      - name: Create GitHub Release Draft (On Tag Push or Manual Request)
        if: startsWith(github.ref, 'refs/tags/v') || (github.event.inputs && github.event.inputs.create_release == 'true')
        uses: softprops/action-gh-release@v2
        with:
          files: ReferenceTracker-Windows-Portable-x64.zip
          name: ReferenceTracker Portable Windows ${{ github.ref_name }}
          body: |
            ## Material Reference & Sample Tracking System - Portable Windows Release

            Standalone, offline-first portable executable for Windows x64.

            ### Package Contents:
            - `ReferenceTracker.exe`: Standalone desktop executable (no install required).
            - `ReferenceTracker_Data/`: Visible data directory located directly beside the `.exe` holding your SQLite database, reference photos, document attachments, generated Word forms, and templates.
            - `README_PORTABLE.txt`: Portability and backup instructions.
            - `START_PORTABLE.bat`: One-click startup script.

            ### Instructions:
            1. Download `ReferenceTracker-Windows-Portable-x64.zip`.
            2. Extract the zip to any folder, Desktop, or USB drive.
            3. Run `ReferenceTracker.exe`.
          draft: true
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
